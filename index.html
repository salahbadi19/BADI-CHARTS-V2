<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>BADI-CHARTS-V2 v2.19.2 — WebGL Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1015; color: #e0e3eb; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #chart { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  #toolbar {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    display: flex; gap: 4px; padding: 4px; flex-wrap: wrap;
    background: rgba(26, 30, 42, 0.92);
    border: 1px solid #2a2e39; border-radius: 6px;
    backdrop-filter: blur(6px);
  }
  #toolbar button {
    min-width: 36px; height: 30px; padding: 0 8px;
    background: #2a2e39; color: #d1d4dc; border: 1px solid #2a2e39;
    border-radius: 4px; cursor: pointer; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  #toolbar button:hover { background: #363a45; color: #fff; }
  #toolbar button.active { background: #2962ff; color: #fff; border-color: #2962ff; }
  #toolbar .sep { width: 1px; background: #2a2e39; margin: 4px 2px; }

  #hud {
    position: fixed; top: 8px; right: 8px; z-index: 10;
    padding: 6px 10px; border-radius: 6px;
    background: rgba(26, 30, 42, 0.92); border: 1px solid #2a2e39;
    font-size: 12px; line-height: 1.5; text-align: right;
  }
  #hud .gl-on  { color: #26a69a; font-weight: 600; }
  #hud .gl-off { color: #ef5350; font-weight: 600; }
</style>
</head>
<body>
<canvas id="chart"></canvas>

<!-- Custom HTML toolbar — wire buttons to the chart API -->
<div id="toolbar">
  <button data-tool="cursor" class="active" title="Cursor">↖</button>
  <div class="sep"></div>
  <button data-tool="trend"   title="Trend Line">╱</button>
  <button data-tool="hline"   title="Horizontal Line">─</button>
  <button data-tool="vline"   title="Vertical Line">│</button>
  <button data-tool="rect"    title="Rectangle">▭</button>
  <button data-tool="fib"     title="Fib Retracement">Fib</button>
  <button data-tool="brush"   title="Brush">~</button>
  <button data-tool="text"    title="Text">T</button>
  <button data-tool="eraser"  title="Eraser">✕</button>
  <button data-tool="circle"  title="Circle (custom tool)">○ Circle</button>
  <div class="sep"></div>
  <button data-ind="sma20"   class="active">SMA20</button>
  <button data-ind="sma50"   class="active">SMA50</button>
  <button data-ind="bb"      class="active">BB</button>
  <button data-ind="rsi"     class="active">RSI</button>
  <button data-ind="volume"  class="active">Vol</button>
  <div class="sep"></div>
  <button data-action="reset"    title="Reset view">Rst</button>
  <button data-action="clear"    title="Clear drawings">Clr</button>
</div>

<div id="hud">
  <div>Renderer: <span id="glStatus" class="gl-off">…</span></div>
  <div>FPS: <span id="fps">—</span> · Candles: <span id="nCandles">—</span></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     BADI-CHARTS-V2 v2.19.0 — WEBGL EDITION (complete standalone library).
     ONE file. No chart.js needed. Drop-in: same API as the 2D edition.
     CDN: https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@v2.20.8/chart-webgl.js
     ══════════════════════════════════════════════════════════════════ -->
<script src="chart-webgl.js"></script>
<script>
  // ─── 1. Create the chart (identical API to the 2D edition) ──────────
  const chart = new BadiCharts(document.getElementById('chart'), {
    symbol:    { label: 'BTCUSDT', priceScale: 100, decimals: 2 },
    timeframe: { label: '1H', ms: 3600000 },
    // v2.20.1: enable the floating countdown near the forming candle.
    // 'auto' format = always 2 digits, picks the unit from the timeframe
    // (minutes for H1 → "60".."00").
    countdown: { enabled: true, format: 'auto', color: '#ff9800', fontSize: 12, offsetX: 8 }
  });
  chart.start();

  // Renderer status (WebGL canvas behind the overlay, 2D fallback if none)
  const glStatus = document.getElementById('glStatus');
  if (chart._glBackend && chart._glBackend.ready) {
    glStatus.textContent = 'WebGL ✓ (GPU)';
    glStatus.className = 'gl-on';
  } else {
    glStatus.textContent = 'Canvas 2D fallback';
    glStatus.className = 'gl-off';
  }

  // ─── 2. Register a CUSTOM drawing tool (unchanged API) ──────────────
  chart.addDrawingTool({
    id: 'circle',
    label: 'Circle',
    icon: '○',
    defaultStyle: { color: '#ff9800', lineWidth: 1.5 },
    onStart: function (ctx) {
      return { type: 'circle', cx: ctx.x, cy: ctx.y, i: ctx.idx, p: ctx.price, radius: 0, color: '#ff9800', lineWidth: 1.5 };
    },
    onUpdate: function (drawing, ctx) {
      drawing.radius = Math.hypot(ctx.x - drawing.cx, ctx.y - drawing.cy);
    },
    onDraw: function (ctx, d, helpers) {
      ctx.strokeStyle = d.color;
      ctx.lineWidth = d.lineWidth || 1.5;
      ctx.beginPath();
      ctx.arc(d.cx, d.cy, Math.max(1, d.radius), 0, Math.PI * 2);
      ctx.stroke();
    },
    onHitTest: function (d, x, y, helpers) {
      return Math.abs(Math.hypot(x - d.cx, y - d.cy) - d.radius) < 8;
    }
  });

  // ─── 3. Custom indicators — IDENTICAL contract to the 2D edition ────
  // Overlay: SMA lines render through GLCtx → batched GL triangles.
  function smaDef(id, label, color, period) {
    return {
      id: id, label: label, type: 'overlay', color: color,
      settings: { period: period, color: color },
      calculate: function (c, s) {
        const out = new Array(c.length).fill(null);
        let sum = 0; const p = s.period || period;
        for (let i = 0; i < c.length; i++) {
          sum += c[i].close;
          if (i >= p) sum -= c[i - p].close;
          if (i >= p - 1) out[i] = sum / p;
        }
        return out;
      },
      render: function (ctx, v, h, s) {
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath();
        let started = false;
        for (let i = h.firstIdx; i <= h.lastIdx; i++) {
          if (v[i] === null) { started = false; continue; }
          const x = h.indexToX(i), y = h.priceToY(v[i]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    };
  }
  chart.addIndicator(smaDef('sma20', 'SMA 20', '#2962ff', 20));
  chart.addIndicator(smaDef('sma50', 'SMA 50', '#ff9800', 50));

  // Bollinger Bands — fill + stroke (gradient fill is GPU-sampled per vertex)
  chart.addIndicator({
    id: 'bb', label: 'Bollinger', type: 'overlay', color: '#9c27b0',
    settings: { period: 20, mult: 2, color: '#9c27b0' },
    calculate: function (c, s) {
      const out = new Array(c.length).fill(null);
      const p = s.period, k = s.mult;
      for (let i = p - 1; i < c.length; i++) {
        let sum = 0;
        for (let j = i - p + 1; j <= i; j++) sum += c[j].close;
        const mean = sum / p;
        let v = 0;
        for (let j = i - p + 1; j <= i; j++) v += (c[j].close - mean) * (c[j].close - mean);
        const sd = Math.sqrt(v / p);
        out[i] = { mid: mean, upper: mean + k * sd, lower: mean - k * sd };
      }
      return out;
    },
    render: function (ctx, v, h, s) {
      // band fill
      ctx.beginPath();
      let started = false;
      const top = [];
      for (let i = h.firstIdx; i <= h.lastIdx; i++) {
        const val = v[i]; if (!val) continue;
        const x = h.indexToX(i), y = h.priceToY(val.upper);
        top.push([x, h.priceToY(val.lower)]);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      for (let i = top.length - 1; i >= 0; i--) ctx.lineTo(top[i][0], top[i][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(156,39,176,0.10)';
      ctx.fill();
      // mid line
      ctx.strokeStyle = s.color; ctx.lineWidth = 1; ctx.beginPath();
      started = false;
      for (let i = h.firstIdx; i <= h.lastIdx; i++) {
        const val = v[i]; if (!val) continue;
        const x = h.indexToX(i), y = h.priceToY(val.mid);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  });

  // Volume bars (auto-drawn) + SMA on volume — type='volume'
  chart.addIndicator({ id: 'volume', label: 'Volume', type: 'volume', color: '#26a69a' });

  // RSI pane — WITH h.drawOnMain(): projects the overbought/oversold touch
  // levels onto the MAIN candle chart (v2.18.0 feature, WebGL-native now).
  chart.addIndicator({
    id: 'rsi', label: 'RSI 14', type: 'pane', color: '#d32f53',
    settings: { period: 14, color: '#d32f53' },
    calculate: function (c, s) {
      const p = s.period || 14;
      const out = new Array(c.length).fill(null);
      let avgGain = 0, avgLoss = 0;
      for (let i = 0; i < c.length; i++) {
        if (i === 0) { out[i] = 50; continue; }
        const ch = c[i].close - c[i - 1].close;
        const gain = ch > 0 ? ch : 0, loss = ch < 0 ? -ch : 0;
        if (i <= p) {
          avgGain += gain; avgLoss += loss;
          if (i === p) {
            avgGain /= p; avgLoss /= p;
            out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
          }
        } else {
          avgGain = (avgGain * (p - 1) + gain) / p;
          avgLoss = (avgLoss * (p - 1) + loss) / p;
          out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
        }
      }
      return out;
    },
    getRange: function () { return { min: 0, max: 100 }; },
    render: function (ctx, v, h, s) {
      ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      const y70 = h.paneToY(70), y30 = h.paneToY(30);
      ctx.strokeStyle = '#ef5350';
      ctx.beginPath(); ctx.moveTo(h.chartLeft, y70); ctx.lineTo(h.chartRight, y70); ctx.stroke();
      ctx.strokeStyle = '#26a69a';
      ctx.beginPath(); ctx.moveTo(h.chartLeft, y30); ctx.lineTo(h.chartRight, y30); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath();
      let started = false;
      for (let i = h.firstIdx; i <= h.lastIdx; i++) {
        if (v[i] === null) { started = false; continue; }
        const x = h.indexToX(i), y = h.paneToY(v[i]);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // drawOnMain — runs on the MAIN chart layer through GLCtx → GPU
      h.drawOnMain(function (mctx, mh) {
        const last = mh.candles[mh.lastIdx];
        if (!last) return;
        const y = mh.priceToY(last.close);
        mctx.strokeStyle = 'rgba(255,183,77,0.55)';
        mctx.setLineDash([2, 2]);
        mctx.lineWidth = 1;
        mctx.beginPath();
        mctx.moveTo(mh.chartLeft, y);
        mctx.lineTo(mh.chartRight, y);
        mctx.stroke();
        mctx.setLineDash([]);
      });
    }
  });

  // ─── 4. Feed data (5,000 candles — pan/zoom stays smooth) ───────────
  // v2.20.1: align the LAST candle's time to the START of the current
  // period (floor(now/tfSec)*tfSec). That makes its close = the NEXT period
  // boundary (in the future), so the countdown has a real positive value to
  // tick down from. Before, last.time = now - tfSec → close = now →
  // remainingSec clamped to 0 forever → countdown looked frozen at "00".
  (function () {
    const N = 5000, tfSec = 3600, tf = 3600000;
    const nowSec = Math.floor(Date.now() / 1000);
    const lastCandleStart = Math.floor(nowSec / tfSec) * tfSec;   // start of current hour
    const firstCandleStart = lastCandleStart - (N - 1) * tfSec;
    let price = 42000;
    const out = [];
    for (let i = 0; i < N; i++) {
      const o = price;
      price = Math.max(1000, price + (Math.sin(i / 41) + Math.cos(i / 113) + (Math.random() - 0.5)) * 140);
      out.push({ time: firstCandleStart + i * tfSec, open: o, high: Math.max(o, price) + 60, low: Math.min(o, price) - 60, close: price, volume: 800 + Math.random() * 3200 });
    }
    chart.setData(out);
    document.getElementById('nCandles').textContent = N.toLocaleString();

    // v2.20.1: simple live-feed simulation so the countdown is visibly alive.
    // Every 2s, jitter the forming candle's close/high/low; when the wall
    // clock crosses the next tf boundary, roll over to a fresh candle via
    // chart.update() (which appends if the time is newer, replaces if same).
    let liveTimer = null;
    function startLiveFeed() {
      if (liveTimer) return;
      liveTimer = setInterval(function () {
        const cs = chart.sim && chart.sim.candles;
        if (!cs || cs.length === 0) return;
        const last = cs[cs.length - 1];
        const tfMs = (chart.timeframe && chart.timeframe.ms) || 3600000;
        const nowSec2 = Math.floor(Date.now() / 1000);
        const closeSec = last.time + Math.round(tfMs / 1000);
        if (nowSec2 >= closeSec) {
          // Crossed the boundary → push a new forming candle.
          const newOpen = last.close;
          chart.update({ time: closeSec, open: newOpen, high: newOpen + 1, low: newOpen - 1, close: newOpen, volume: 800 });
        } else {
          // Same period → jitter the forming candle's close (and H/L).
          const drift = (Math.random() - 0.5) * 80;
          const nc = Math.max(1000, last.close + drift);
          const updated = {
            time: last.time,
            open: last.open,
            high: Math.max(last.high, nc),
            low:  Math.min(last.low,  nc),
            close: nc,
            volume: (last.volume || 0) + Math.random() * 50
          };
          chart.update(updated);   // same time → replaces the last candle
        }
      }, 2000);
    }
    startLiveFeed();
    window.stopLiveFeed = function () { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } };
  })();

  // ─── 5. Toolbar wiring — indicator defs live in a lookup for re-adding ─
  const bbDef2 = function () {
    return {
      id: 'bb', label: 'Bollinger', type: 'overlay', color: '#9c27b0',
      settings: { period: 20, mult: 2, color: '#9c27b0' },
      calculate: function (c, s) {
        const out = new Array(c.length).fill(null);
        const p = s.period, k = s.mult;
        for (let i = p - 1; i < c.length; i++) {
          let sum = 0;
          for (let j = i - p + 1; j <= i; j++) sum += c[j].close;
          const mean = sum / p;
          let v = 0;
          for (let j = i - p + 1; j <= i; j++) v += (c[j].close - mean) * (c[j].close - mean);
          const sd = Math.sqrt(v / p);
          out[i] = { mid: mean, upper: mean + k * sd, lower: mean - k * sd };
        }
        return out;
      },
      render: function (ctx, v, h, s) {
        ctx.beginPath();
        let started = false;
        const bot = [];
        for (let i = h.firstIdx; i <= h.lastIdx; i++) {
          const val = v[i]; if (!val) continue;
          const x = h.indexToX(i), y = h.priceToY(val.upper);
          bot.push([x, h.priceToY(val.lower)]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
        ctx.closePath();
        ctx.fillStyle = 'rgba(156,39,176,0.10)';
        ctx.fill();
        ctx.strokeStyle = s.color; ctx.lineWidth = 1; ctx.beginPath();
        started = false;
        for (let i = h.firstIdx; i <= h.lastIdx; i++) {
          const val = v[i]; if (!val) continue;
          const x = h.indexToX(i), y = h.priceToY(val.mid);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    };
  };
  const rsiDef2 = function () {
    return {
      id: 'rsi', label: 'RSI 14', type: 'pane', color: '#d32f53',
      settings: { period: 14, color: '#d32f53' },
      calculate: function (c, s) {
        const p = s.period || 14;
        const out = new Array(c.length).fill(null);
        let avgGain = 0, avgLoss = 0;
        for (let i = 0; i < c.length; i++) {
          if (i === 0) { out[i] = 50; continue; }
          const ch = c[i].close - c[i - 1].close;
          const gain = ch > 0 ? ch : 0, loss = ch < 0 ? -ch : 0;
          if (i <= p) {
            avgGain += gain; avgLoss += loss;
            if (i === p) { avgGain /= p; avgLoss /= p; out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss); }
          } else {
            avgGain = (avgGain * (p - 1) + gain) / p;
            avgLoss = (avgLoss * (p - 1) + loss) / p;
            out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
          }
        }
        return out;
      },
      getRange: function () { return { min: 0, max: 100 }; },
      render: function (ctx, v, h, s) {
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath();
        let started = false;
        for (let i = h.firstIdx; i <= h.lastIdx; i++) {
          if (v[i] === null) { started = false; continue; }
          const x = h.indexToX(i), y = h.paneToY(v[i]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    };
  };
  const IND_DEFS = {
    sma20: function () { return smaDef('sma20', 'SMA 20', '#2962ff', 20); },
    sma50: function () { return smaDef('sma50', 'SMA 50', '#ff9800', 50); },
    bb: bbDef2,
    rsi: rsiDef2,
    volume: function () { return { id: 'volume', label: 'Volume', type: 'volume', color: '#26a69a' }; }
  };
  const buttons = document.querySelectorAll('#toolbar button');
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const tool = btn.getAttribute('data-tool');
      const ind = btn.getAttribute('data-ind');
      const action = btn.getAttribute('data-action');
      if (tool) {
        chart.setTool(tool);
      } else if (ind) {
        if (chart.getActiveIndicators().indexOf(ind) >= 0) {
          chart.removeIndicator(ind);
          btn.classList.remove('active');
        } else {
          btn.classList.add('active');
          chart.addIndicator(IND_DEFS[ind]());
        }
      } else if (action === 'reset') chart.resetView();
      else if (action === 'clear') chart.clearDrawings();
    });
  });
  chart.onToolChange(function (toolId) {
    buttons.forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tool') === toolId);
    });
  });

  // ─── 6. FPS meter ───────────────────────────────────────────────────
  (function () {
    const el = document.getElementById('fps');
    let frames = 0, last = performance.now();
    function tick(now) {
      frames++;
      if (now - last >= 1000) {
        el.textContent = frames;
        frames = 0; last = now;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
