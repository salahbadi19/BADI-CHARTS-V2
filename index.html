<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>BADI-CHARTS-V2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1015; }
  #chart { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="chart"></canvas>

<!-- BADI-CHARTS-V2 from CDN -->
<script src="https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@v1.1.4/chart.js"></script>
<script>
  // EMPTY chart — no toolbar, no status bar, no indicators, no data
  const chart = new BadiCharts(document.getElementById('chart'), {
    symbol: { label: 'SYMBOL', priceScale: 100, decimals: 2 },
    timeframe: { label: '1H', ms: 3600000 },
    indicators: [],        // no indicators
    toolbar: false,        // no toolbar
    statusBar: false       // no status bar
  });
  chart.start();

  // Feed your data here:
  // chart.setData([{time, open, high, low, close, volume}, ...]);
  // chart.update(latestCandle);
</script>
</body>
</html>
