<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>BADI-CHARTS-V2 — Live Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1015; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #chart { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="chart"></canvas>

<!-- ============================================================
     BADI-CHARTS-V2 — Live Demo (auto-loads real candles)
     ============================================================
     CDN URL (jsDelivr):
       https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@main/chart.js

     Local usage:
       <script src="chart.js"></script>
     ============================================================ -->

<!-- Load BADI-CHARTS-V2 from CDN (jsDelivr) -->
<script src="https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@main/chart.js"></script>

<script>
/* =============================================================================
 * BADI-CHARTS-V2 — Live Demo
 *
 * This page automatically loads REAL BTC/USDT 1H candles from Binance's
 * public REST API (no API key needed) and streams live updates via WebSocket.
 *
 * To use your own data source, replace the fetch/WebSocket calls below.
 *
 * Public API:
 *   chart.setData(candles);           // [{time, open, high, low, close, volume}, ...]
 *   chart.update(candle);             // real-time tick
 *   chart.addIndicator('ma20');       // ma20/ma50/ma200/ema20/ema50/bb/volsma/rsi/macd/vprof
 *   chart.setTool('trend');           // cursor/trend/channel/hline/vline/band/rect/arrow/fib/brush/poly/text/ray/eraser
 *   chart.resetView();
 *   chart.start();
 * ============================================================================= */

(function () {
  const canvas = document.getElementById('chart');

  // Create the chart with default indicators (MA20 + MA50 + Vol SMA)
  const chart = new BadiCharts(canvas, {
    symbol:    { label: 'BTCUSDT', priceScale: 100, decimals: 2 },
    timeframe: { label: '1H', ms: 60 * 60 * 1000 },
    indicators: ['ma20', 'ma50', 'volsma']
  });
  window.chart = chart;

  // ─── Fetch REAL candles from Binance public API (no API key needed) ───────
  //    Binance returns: [[openTime, open, high, low, close, volume, closeTime, ...], ...]
  //    We convert to: {time (unix seconds), open, high, low, close, volume}
  async function fetchBinanceCandles(symbol, interval, limit) {
    const url = 'https://api.binance.com/api/v3/klines?symbol=' + symbol + '&interval=' + interval + '&limit=' + limit;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Binance API error: ' + res.status);
    const raw = await res.json();
    return raw.map(function (k) {
      return {
        time: Math.floor(k[0] / 1000),   // openTime in ms → seconds
        open:  parseFloat(k[1]),
        high:  parseFloat(k[2]),
        low:   parseFloat(k[3]),
        close: parseFloat(k[4]),
        volume: parseFloat(k[5])
      };
    });
  }

  // ─── Load initial data, then start the chart ───────────────────────────────
  fetchBinanceCandles('BTCUSDT', '1h', 500)
    .then(function (candles) {
      chart.setData(candles);
      chart.start();
      console.log('[BADI-CHARTS-V2] Loaded ' + candles.length + ' candles from Binance');
    })
    .catch(function (err) {
      console.error('[BADI-CHARTS-V2] Failed to load data:', err);
      // Still start the chart so the empty UI is visible
      chart.start();
    });

  // ─── (Optional) Subscribe to real-time updates via Binance WebSocket ──────
  //    Uncomment the block below to enable live ticks:
  /*
  const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1h');
  ws.onmessage = function (ev) {
    const msg = JSON.parse(ev.data);
    const k = msg.k;
    if (!k) return;
    chart.update({
      time: Math.floor(k.t / 1000),
      open:  parseFloat(k.o),
      high:  parseFloat(k.h),
      low:   parseFloat(k.l),
      close: parseFloat(k.c),
      volume: parseFloat(k.v)
    });
  };
  */
})();
</script>
</body>
</html>
