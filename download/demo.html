<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>TradingView-Style Chart — Demo with Real Data (Binance)</title>
<style>
  body { margin:0; background:#0e1015; overflow:hidden; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  #chart { display:block; }
  #loader {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#cfd2da; font-size:14px; background:#1a1e2a; padding:14px 22px;
    border-radius:6px; border:1px solid #2a2e39; z-index:10;
  }
</style>
</head>
<body>
<canvas id="chart"></canvas>
<div id="loader">Loading real BTCUSDT 1H data from Binance…</div>

<!-- ============================================================
     Load the chart library (chart.js = the engine, no fake data)
     ============================================================ -->
<script src="chart.js"></script>

<script>
/* =============================================================================
 * DEMO: How to use the TradingChart library with REAL data.
 *
 * This demo fetches real BTC/USDT candles from Binance's public REST API.
 * Replace this fetch logic with your own data source (WebSocket, REST, etc.).
 *
 * Public API of TradingChart:
 *   const chart = new TradingChart(canvas, {
 *     symbol:    { label:'BTCUSDT', priceScale:100, decimals:2 },
 *     timeframe: { label:'1H', ms:60*60*1000 },
 *     indicators: ['ma20','ma50','volsma']  // optional initial indicators
 *   });
 *   chart.setData(candles);           // candles: [{time, open, high, low, close, volume}, ...]
 *   chart.update(candle);             // real-time tick: append or update last candle
 *   chart.append(candles);            // batch append
 *   chart.setSymbol({label, priceScale, decimals});
 *   chart.setTimeframe({label, ms});
 *   chart.addIndicator('rsi');        // 'ma20','ma50','ma200','ema20','ema50','bb','volsma','rsi','macd','vprof'
 *   chart.removeIndicator('rsi');
 *   chart.setTool('trend');           // 'cursor','trend','channel','hline','vline','band','rect','arrow','fib','brush','poly','text','ray','eraser'
 *   chart.addDrawing({type:'hline', price: 65000, color:'#2962ff'});
 *   chart.clearDrawings();
 *   chart.resetView();
 *   chart.fit();
 *   chart.onCrosshair(cb => { ... });
 *   chart.start();                    // start the render loop
 * ============================================================================= */

(async function() {
  // 1. Style the page
  document.body.style.background = '#0e1015';

  // 2. Create the chart instance with user configuration (NO fake data)
  const canvas = document.getElementById('chart');
  canvas.style.cursor = 'crosshair';
  const chart = new TradingChart(canvas, {
    symbol:    { label:'BTCUSDT', priceScale:100, decimals:2 },
    timeframe: { label:'1H', ms:60*60*1000 },
    indicators: ['ma20','ma50','volsma']
  });
  window.__chart = chart;

  // 3. Fetch REAL candles from Binance public API (no API key needed)
  //    Binance returns: [{openTime, open, high, low, close, volume, closeTime, ...}, ...]
  //    We convert to our format: {time (unix seconds), open, high, low, close, volume}
  async function fetchBinanceCandles(symbol, interval, limit = 500) {
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Binance API error: ' + res.status);
    const raw = await res.json();
    return raw.map(k => ({
      time: Math.floor(k[0] / 1000),   // openTime in ms → seconds
      open:  parseFloat(k[1]),
      high:  parseFloat(k[2]),
      low:   parseFloat(k[3]),
      close: parseFloat(k[4]),
      volume: parseFloat(k[5])
    }));
  }

  try {
    const candles = await fetchBinanceCandles('BTCUSDT', '1h', 500);
    // 4. Push real data into the chart
    chart.setData(candles);
    document.getElementById('loader').style.display = 'none';
    // 5. Start the render loop
    chart.start();

    // 6. (Optional) Subscribe to real-time updates via Binance WebSocket
    //    Uncomment to enable live ticks:
    /*
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1h');
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      const k = msg.k;
      if (!k) return;
      chart.update({
        time: Math.floor(k.t / 1000),
        open:  parseFloat(k.o),
        high:  parseFloat(k.h),
        low:   parseFloat(k.l),
        close: parseFloat(k.c),
        volume: parseFloat(k.v)
      });
    };
    */
  } catch (err) {
    document.getElementById('loader').textContent = 'Failed to load data: ' + err.message + ' — check your network or use your own data source.';
    console.error(err);
    // Still start the chart so the user can see the empty UI
    chart.start();
  }
})();
</script>
</body>
</html>
