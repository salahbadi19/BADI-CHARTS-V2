<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>BADI-CHARTS-V2 — Empty Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e1015; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #chart { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="chart"></canvas>

<!-- ============================================================
     BADI-CHARTS-V2 — Empty Chart Template
     ============================================================
     CDN URL (jsDelivr):
       https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@main/chart.js

     Local usage:
       <script src="chart.js"></script>

     This template starts with an EMPTY chart (no indicators, no data).
     Feed your own candle data via chart.setData(candles).
     ============================================================ -->

<!-- Load BADI-CHARTS-V2 from CDN (jsDelivr) -->
<script src="https://cdn.jsdelivr.net/gh/salahbadi19/BADI-CHARTS-V2@main/chart.js"></script>

<script>
/* =============================================================================
 * BADI-CHARTS-V2 — Empty Chart Setup
 *
 * The chart starts completely empty:
 *   - No candle data (call chart.setData() to feed yours)
 *   - No indicators (call chart.addIndicator() to add)
 *   - No drawings
 *
 * Public API:
 *   chart.setData(candles);           // [{time, open, high, low, close, volume}, ...]
 *   chart.update(candle);             // real-time tick
 *   chart.addIndicator('ma20');       // ma20/ma50/ma200/ema20/ema50/bb/volsma/rsi/macd/vprof
 *   chart.setTool('trend');           // cursor/trend/channel/hline/vline/band/rect/arrow/fib/brush/poly/text/ray/eraser
 *   chart.resetView();
 *   chart.start();
 * ============================================================================= */

(function () {
  const canvas = document.getElementById('chart');

  // Create an EMPTY chart: no indicators, no data
  const chart = new BadiCharts(canvas, {
    symbol:    { label: 'SYMBOL', priceScale: 100, decimals: 2 },
    timeframe: { label: '1H', ms: 60 * 60 * 1000 },
    indicators: []   // start empty — add via chart.addIndicator() later
  });

  // Start the render loop (renders empty UI: toolbar, axes, grid)
  chart.start();

  // Expose for debugging / console access
  window.chart = chart;

  /* ---------------------------------------------------------------------------
   * EXAMPLE: how to feed your own data (uncomment to use)
   * ---------------------------------------------------------------------------
   *
   * // 1. From a REST API:
   * fetch('https://your-api.com/candles?symbol=BTCUSDT&tf=1h')
   *   .then(r => r.json())
   *   .then(candles => {
   *     chart.setData(candles);
   *   });
   *
   * // 2. From Binance public API (no key needed):
   * fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=500')
   *   .then(r => r.json())
   *   .then(raw => raw.map(k => ({
   *     time: Math.floor(k[0] / 1000),
   *     open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5]
   *   })))
   *   .then(candles => chart.setData(candles));
   *
   * // 3. From a WebSocket (real-time):
   * const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1h');
   * ws.onmessage = (ev) => {
   *   const k = JSON.parse(ev.data).k;
   *   if (!k) return;
   *   chart.update({
   *     time: Math.floor(k.t / 1000),
   *     open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v
   *   });
   * };
   *
   * // 4. Add indicators:
   * chart.addIndicator('ma20');
   * chart.addIndicator('ma50');
   * chart.addIndicator('rsi');
   * ---------------------------------------------------------------------------
   */
})();
</script>
</body>
</html>
