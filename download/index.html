<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>CanvasKlines — Pure JS Canvas Chart Library</title>
<style>
  body { margin:0; background:#0e1015; overflow:hidden; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  #chart { display:block; }
  #hint {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#cfd2da; font-size:14px; background:#1a1e2a; padding:18px 26px;
    border-radius:6px; border:1px solid #2a2e39; z-index:10; max-width:80vw; line-height:1.6;
    text-align:center;
  }
  #hint code { color:#26a69a; background:#0e1015; padding:2px 6px; border-radius:3px; font-size:12px; }
  #hint h1 { margin:0 0 8px 0; font-size:18px; color:#f0f3fa; }
</style>
</head>
<body>
<canvas id="chart"></canvas>
<div id="hint">
  <h1>CanvasKlines</h1>
  Chart engine loaded. Provide your data to start.<br>
  See <code>demo.html</code> for a working example with real Binance data.<br>
  <small style="color:#787b86">Minimal usage: <code>chart.setData(candles)</code></small>
</div>

<script src="chart.js"></script>
<script>
// Minimal empty-chart example. The chart will render the UI chrome
// (toolbar, axes, grid) but no candles until you call setData().
// See demo.html for a full real-data example.
document.body.style.background = '#0e1015';
const canvas = document.getElementById('chart');
canvas.style.cursor = 'crosshair';
const chart = new CanvasKlines(canvas, {
  symbol:    { label:'YOUR_SYMBOL', priceScale:100, decimals:2 },
  timeframe: { label:'1H', ms:60*60*1000 },
  indicators: []
});
window.__chart = chart;
chart.start();

// Example: how to feed data
// fetch('https://your-api.com/candles').then(r => r.json()).then(candles => {
//   chart.setData(candles);
//   document.getElementById('hint').style.display = 'none';
// });
</script>
</body>
</html>
